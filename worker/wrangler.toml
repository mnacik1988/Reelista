name = "reelista"
main = "index.js"
compatibility_date = "2026-06-22"

# Распознавание речи для титров (Whisper на Workers AI).
[ai]
binding = "AI"

# Суточный счётчик распознаваний — хард-стоп кошелька.
[[kv_namespaces]]
binding = "DB"
id = "30dc9762ffdd46288d54a59621325e25"

# Лимит частоты по IP. Встроенный Rate Limiting работает на *.workers.dev
# (в отличие от Cache API — урок Mynado 10.10.2026). period — только 10 или 60 с.
# namespace_id свой, чтобы не делить счётчик с Mynado («1001»).
[[ratelimits]]
name = "RL"
namespace_id = "2001"
simple = { limit = 6, period = 60 }

[observability]
enabled = true
head_sampling_rate = 1
